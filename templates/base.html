{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa:wght@200..800&family=Noto+Sans+Kannada:wght@100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    {% block meta %} {% endblock meta %}
</head>

<body>
    <header class="site-header">
        <nav class="container">
            <div class="container-left">
                <img class="menu" src="{% static 'img/hamburger.png' %}" alt="Menu">

                <a href="{% url 'dashboard:show_dashboard_home' %}">
                    <img class="logo" src="{% static 'img/logo.png' %}" alt="Logo">
                    BhumiLestari
                </a>
            </div> 
        
            <div class="container-right">
                <form id="search-form" method="get" action="{% url 'dashboard:show_dashboard_home' %}" class="search">
                    <input id="search-input"
                        type="search"
                        name="title"
                        value="{{ request.GET.title }}"
                        placeholder="Cari produk Anda di sini..."
                        class="search__input"
                        aria-label="Cari produk Anda di sini...">
                </form>

                {% if user.is_authenticated %}
                <div class="nav-user-menu">
                    <button type="button" class="nav-user" id="userMenuBtn" aria-haspopup="true" aria-expanded="false">
                        <img class="nav-avatar"
                     src="{% if user.logo %}{{ user.logo.url }}{% else %}{% static 'img/user.png' %}{% endif %}"
                     alt="Logo akun">
                        <span class="nav-username">{{ user.seller_profile.store_name|default:user.username }}</span>
                    </button>

                    <div class="nav-dropdown" id="userMenu" hidden>
                        <form method="POST" action="{% url 'users:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="nav-dropdown-item">Logout</button>
                        </form>
                    </div>
                </div>
                {% else %}
                    <a href="{% url 'users:login' %}" class="btn-login">Login</a>
                    <a href="{% url 'users:register' %}" class="btn-register">Daftar</a>
                {% endif %}  
            </div>
        </nav>
    </header>

    <div class="layout sidebar-closed role-{{ user.role|default:'guest' }}">
        {% include "components/sidebar.html" %}
        <div class="layout-content">
            {% block content %} {% endblock content %}
        </div>
    </div>

    <footer> 
        <div class="site-footer">
            <p>Dibuat dengan sepenuh hati - Tim PBP E 8</p>
        </div>
    </footer>

    <script src="{% static 'js/sidebar.js' %}"></script>
    <script>
    (function () {
        var btn = document.getElementById('userMenuBtn');
        var menu = document.getElementById('userMenu');
        if (!btn || !menu) return;

        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var open = menu.hidden;
            menu.hidden = !open;
            btn.setAttribute('aria-expanded', open);
        });

        document.addEventListener('click', function () {
            menu.hidden = true;
            btn.setAttribute('aria-expanded', 'false');
        });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') menu.hidden = true;
        });
    })();
    </script>
</body> 
</html>
